name: Build NEBULIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Godot with Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Android export signing and SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -noprompt -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text(encoding="utf-8")
          replacements = {
              'keystore/debug=""': 'keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in replacements.items():
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit("Missing Android preset field: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Android debug signing configured.")
          PY

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit --verbose 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" godot-import.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android" build/NEBULIA-debug.apk --verbose 2>&1 | tee godot-export.log
          test -s build/NEBULIA-debug.apk
          ls -lh build/NEBULIA-debug.apk
          sha256sum build/NEBULIA-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-Android-debug
          path: build/NEBULIA-debug.apk
          if-no-files-found: error
          retention-days: 14
