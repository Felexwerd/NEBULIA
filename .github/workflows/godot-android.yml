name: Build NEBULIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NEBULIA_Godot/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Download Godot 4.3.1
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3.1-stable/Godot_v4.3.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3.1-stable/Godot_v4.3.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.1.stable/"

      - name: Validate project scripts
        run: |
          godot --version
          godot --headless --path NEBULIA_Godot --editor --quit

      - name: Export debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          mkdir -p build
          godot --headless --path NEBULIA_Godot --export-debug "Android" build/NEBULIA-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-debug-apk
          path: build/NEBULIA-debug.apk
          if-no-files-found: error
