name: Build NEBULIA playable Android game

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path game --editor --quit
          godot --headless --path game --export-debug "Android" build/NEBULIA.apk

      - name: Verify APK
        run: |
          test -s build/NEBULIA.apk
          ls -lh build/NEBULIA.apk
          sha256sum build/NEBULIA.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-Playable-Android-APK
          path: build/NEBULIA.apk
          if-no-files-found: error
          retention-days: 14
