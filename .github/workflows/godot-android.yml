name: Build NEBULIA playable Android game

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/godot-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --path game --editor --quit --verbose

      - name: Configure debug signing in export preset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/export_presets.cfg")
          s = p.read_text()
          replacements = {
              'keystore/debug=""': 'keystore/debug="' + str(Path.home() / ".android/debug.keystore") + '"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Missing Android preset field: " + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          print("Android debug keystore configured in export preset.")
          PY

      - name: Export Android APK
        run: |
          godot --headless --path game --export-debug "Android" ../build/NEBULIA.apk --verbose

      - name: Verify APK
        run: |
          test -s build/NEBULIA.apk
          ls -lh build/NEBULIA.apk
          sha256sum build/NEBULIA.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-Playable-Android-APK
          path: build/NEBULIA.apk
          if-no-files-found: error
          retention-days: 14
