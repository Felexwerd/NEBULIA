name: Build NEBULIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NEBULIA_Godot/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            latest_dir="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d -name "latest*" | sort | tail -n 1)"
            if [ -n "$latest_dir" ]; then ln -s "$latest_dir" "$ANDROID_HOME/cmdline-tools/latest"; fi
          fi
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Download Godot 4.3
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip"
          mkdir -p NEBULIA_Godot/android/build NEBULIA_Godot/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.3.stable/android_source.zip" -d NEBULIA_Godot/android/build
          test -f NEBULIA_Godot/android/build/build.gradle

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project scripts
        run: |
          set -o pipefail
          godot --version
          godot --headless --path NEBULIA_Godot --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/NEBULIA_Godot/build"
          APK_PATH="$GITHUB_WORKSPACE/NEBULIA_Godot/build/NEBULIA-debug.apk"
          set -o pipefail
          godot --headless --verbose --path "$GITHUB_WORKSPACE/NEBULIA_Godot" --export-debug "Android" "$APK_PATH" 2>&1 | tee /tmp/godot-export.log
          if grep -E "ERROR:|Export:|Android SDK|Gradle|Could not|not found|missing" /tmp/godot-export.log; then
            echo "Godot Android export reported errors."
            exit 1
          fi
          test -s "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-debug-apk
          path: NEBULIA_Godot/build/NEBULIA-debug.apk
          if-no-files-found: error
