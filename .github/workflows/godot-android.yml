name: Build NEBULIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NEBULIA_Godot/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Download Godot 4.3
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Android build template
        run: |
          godot --headless --path NEBULIA_Godot --editor --install-android-build-template --quit 2>&1 | tee /tmp/godot-android-template.log
          if [ ! -d NEBULIA_Godot/android/build ]; then
            echo "Godot did not create the Android build template."
            cat /tmp/godot-android-template.log
            exit 1
          fi

      - name: Validate project scripts
        run: |
          set -o pipefail
          godot --version
          godot --headless --path NEBULIA_Godot --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --path NEBULIA_Godot --export-debug "Android" build/NEBULIA-debug.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/NEBULIA-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-debug-apk
          path: build/NEBULIA-debug.apk
          if-no-files-found: error
