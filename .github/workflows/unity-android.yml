name: NEBULIA Unity Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity project and license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          if [ ! -f UnityProject/ProjectSettings/ProjectSettings.asset ]; then
            echo "ERROR: UnityProject/ProjectSettings/ProjectSettings.asset is missing from the repository."
            echo "The Unity project settings need to be restored/committed before a reliable Android build can run."
            exit 1
          fi

          if [ -n "$UNITY_LICENSING_SERVER" ]; then
            echo "Unity licensing server configured."
          elif [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; }; then
            echo "Unity license credentials configured."
          else
            echo "ERROR: Unity license activation is incomplete."
            echo "Add GitHub Actions secrets UNITY_EMAIL and UNITY_PASSWORD, plus either UNITY_LICENSE (recommended for a Personal license activation file) or UNITY_SERIAL."
            echo "Alternatively, configure UNITY_LICENSING_SERVER."
            echo "No Unity compilation was attempted."
            exit 1
          fi

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          buildName: NEBULIA
          buildsPath: build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEBULIA-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
